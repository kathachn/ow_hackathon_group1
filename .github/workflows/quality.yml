name: Portfolio quality checks
on:
  push:
  pull_request:
jobs:
  static-and-data-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q app.py analyse.py datengrundlage.py methodik.py konzept.py vergleich.py scripts tests
      - name: Check versioned data artifacts
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
